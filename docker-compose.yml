services:
  isotope-envelope:
    build: .
    image: isotope-envelope-api:latest
    container_name: isotope-envelope-api
    ports:
      # 宿主端口可用环境变量 API_PORT 覆盖，例如 API_PORT=9000 docker compose up
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
